# CI: quality gates for the JME Parts Store
# Runs on every push and pull request so problems surface before merge.

name: CI
on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: parts-store

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: parts-store/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Shipped code is gated hard: any moderate+ advisory in a runtime
      # dependency fails the build.
      - name: Dependency audit — production (fail on moderate+)
        run: npm audit --audit-level=moderate --omit=dev

      # Build-time tooling is reported but not gated: advisories there can be
      # unfixable for months when the only patched release requires a major
      # upgrade the toolchain does not support yet (today: brace-expansion
      # GHSA-mh99-v99m-4gvg, fixed only in eslint 10, which eslint-config-next
      # cannot load). Review this output — see SECURITY_NOTES.md.
      - name: Dependency audit — dev tooling (report only)
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Maintenance agent (catalog integrity)
        run: npm run agent:maintenance

      - name: Production build
        run: npm run build

      # Static chunks are served without authentication, so this proves the
      # dealer pricing and customer records in src/lib/qc/data.ts never reach
      # a browser bundle — regardless of which page they were imported from.
      - name: Client-bundle data-boundary check
        run: npm run verify:bundles

      # Every prerendered customer page is read as a customer would read it
      # (scripts and styles dropped) and scanned for price, cost, vendor,
      # margin, bin or quantity language (BUILD_PROMPT.md data boundaries).
      - name: Customer-page data-boundary scan
        run: npm run scan:artifacts

      # The customer flows, driven through the runner's Chrome against the
      # build above: hero search, a quote request, a Support Hub form landing
      # in the ops inbox, the Machine Platform, the fitment hand-off, the
      # assistant, the phone menu — then the WCAG 2.1 AA audit over every
      # public and staff page state. The token is for this throwaway server
      # only; the RFQ store is a temp directory.
      - name: Start the built app
        env:
          PORT: "3100"
          OPS_TOKEN: ci-smoke-only-token
        run: |
          node scripts/serve-standalone.mjs > standalone.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q READY standalone.log; then break; fi
            sleep 1
          done
          grep -q READY standalone.log || { cat standalone.log; exit 1; }

      - name: Browser smoke flows
        env:
          OPS_TOKEN: ci-smoke-only-token
        run: npm run smoke -- http://127.0.0.1:3100

      - name: Accessibility audit (WCAG 2.1 AA)
        env:
          OPS_TOKEN: ci-smoke-only-token
        run: npm run a11y -- http://127.0.0.1:3100

      # Mobile LCP on the slow-4G profile. Runner timings vary, so this
      # reports rather than gates; read it when a page grows.
      - name: Mobile LCP (report only)
        run: npm run lcp -- http://127.0.0.1:3100 || true
        continue-on-error: true
