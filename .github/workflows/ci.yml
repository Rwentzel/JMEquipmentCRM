# CI: quality gates for the JME Parts Store
# Runs on every push and pull request so problems surface before merge.

name: CI
on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: parts-store

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: parts-store/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Blocking gate: anything that ships to a customer's browser or the
      # production server. This is the security promise that matters.
      - name: Dependency audit — production (fail on moderate+)
        run: npm audit --omit=dev --audit-level=moderate

      # Advisory only: build-time tooling (eslint, tsx, types) never reaches
      # production, and its advisories are frequently unfixable without
      # breaking the toolchain — GHSA-mh99-v99m-4gvg is only patched in
      # brace-expansion 5.x, whose export shape breaks eslint's minimatch 3.x,
      # and eslint 10 breaks eslint-plugin-react. Surfaced here so the risk is
      # visible and reviewed rather than silently dropped.
      - name: Dependency audit — dev toolchain (advisory, non-blocking)
        run: npm audit --audit-level=moderate || echo "::warning::Dev-only advisories above; see SECURITY_NOTES.md for the policy."

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Maintenance agent (catalog integrity)
        run: npm run agent:maintenance

      - name: Production build
        run: npm run build

      # Static chunks are served without authentication, so this proves the
      # dealer pricing and customer records in src/lib/qc/data.ts never reach
      # a browser bundle — regardless of which page they were imported from.
      - name: Client-bundle data-boundary check
        run: npm run verify:bundles
