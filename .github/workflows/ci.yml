# CI: quality gates for the JME Parts Store
# Runs on every push and pull request so problems surface before merge.

name: CI
on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: parts-store

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: parts-store/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Shipped code is gated hard: any moderate+ advisory in a runtime
      # dependency fails the build.
      - name: Dependency audit — production (fail on moderate+)
        run: npm audit --audit-level=moderate --omit=dev

      # Build-time tooling is reported but not gated: advisories there can be
      # unfixable for months when the only patched release requires a major
      # upgrade the toolchain does not support yet (today: brace-expansion
      # GHSA-mh99-v99m-4gvg, fixed only in eslint 10, which eslint-config-next
      # cannot load). Review this output — see SECURITY_NOTES.md.
      - name: Dependency audit — dev tooling (report only)
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Maintenance agent (catalog integrity)
        run: npm run agent:maintenance

      - name: Production build
        run: npm run build

      # Static chunks are served without authentication, so this proves the
      # dealer pricing and customer records in src/lib/qc/data.ts never reach
      # a browser bundle — regardless of which page they were imported from.
      - name: Client-bundle data-boundary check
        run: npm run verify:bundles
